// AI: Supabase Edge Function "chef-ai" (Gemini). ללא חיבור – מאגר מובנה ותשובות בסיסיות
async function callAI(action,payload){if(!online())throw new Error('offline');const{data,error}=await SB.functions.invoke('chef-ai',{body:{action,...payload}});
 if(error){let m=error.message;try{const j=await error.context.json();m=j.error||m}catch(_){}throw new Error(m)}if(data&&data.error)throw new Error(data.error);return data}
const aiErr=e=>/rate_limit/.test(e.message)?'הגעת למכסת 50 פניות AI ליום':/offline/.test(e.message)?'AI לא זמין במצב הדגמה':'AI לא זמין כרגע';
const slim=d=>{const{chat,...x}=d;return x};
window.aiRefine=async i=>{const d=cur.dishes[i];if(!d.note)return msg('כתבו קודם מה לשנות (למשל: רוצה יותר חריף)');busy('👨‍🍳 מעדכן את "'+d.n+'"...');
 try{const res=await callAI('refine_dish',{dish:slim(d),note:d.note,extra:d.extra||0});cur.dishes[i]={...res.dish,extra:d.extra||0,chat:d.chat,aiNote:d.note,note:''}}catch(e){toast(aiErr(e)+' – הוחלו שינויים בסיסיים בלבד')}busy('');rSugg()};
const dp=(d,p)=>p+(d.extra||0);
const has=(d,re)=>d.ing.find(x=>re.test(x.n));
function eff(d){const ing=d.ing.map(x=>({...x})),ch=[],t=(d.note||'');const find=re=>ing.find(x=>re.test(x.n));
 if(/פחות חריף|לא חריף|בלי חריף/.test(t)){const i=ing.findIndex(x=>/צ׳ילי|צילי|חריף|פלפל חריף/.test(x.n));if(i>=0){ing.splice(i,1);ch.push('הוסר הצ׳ילי')}else ch.push('לא להוסיף פלפל חריף')}
 else if(/חריף|פיקנטי/.test(t)){const c=find(/צ׳ילי|צילי/);if(c){c.q*=2;ch.push('כמות הצ׳ילי הוכפלה')}else{ing.push(I('צ׳ילי חריף','🌶️',0.25,'יח׳'));ch.push('נוסף צ׳ילי חריף (¼ יח׳ למנה)')}}
 if(/פחות מלח|דל מלח|בלי מלח/.test(t)){const c=find(/מלח|סויה/);if(c){c.q*=0.5;ch.push(c.n+' הופחת בחצי')}else ch.push('להמליח במשורה / לא להוסיף מלח')}
 if(/יותר שום/.test(t)){const c=find(/שום/);if(c){c.q*=1.5;ch.push('כמות השום הוגדלה פי 1.5')}else{ing.push(I('שום','🧄',1,'שן'));ch.push('נוסף שום')}}
 if(/פחות שום|בלי שום/.test(t)){const i=ing.findIndex(x=>/שום/.test(x.n));if(i>=0){ing.splice(i,1);ch.push('השום הוסר')}}
 if(/בלי בצל/.test(t)){const i=ing.findIndex(x=>/בצל/.test(x.n));if(i>=0){ing.splice(i,1);ch.push('הבצל הוסר')}}
 if(/בלי גבינה|טבעוני|ללא חלב/.test(t)){for(let i=ing.length-1;i>=0;i--)if(/גבינ|פרמזן|מוצרלה|חלב/.test(ing[i].n)){ch.push(ing[i].n+' הוסר');ing.splice(i,1)}}
 if(/יותר ירקות/.test(t)){ing.forEach(x=>{if(/עגבני|פלפל|מלפפון|גזר|ברוקולי|קישוא|פטריות|כרוב/.test(x.n))x.q*=1.3});ch.push('כמות הירקות הוגדלה ב-30%')}
 return {ing,ch};}

 <div class="ctr" style="margin-top:6px"><span>מנות נוספות:</span><button onclick="xtra(${i},-1)">−</button><b id="ex${i}">${d.extra||0}</b><button onclick="xtra(${i},1)">+</button><span class="muted">סה״כ ${fmt(dp(d,p))} מנות</span></div></div>`}

 if(online()){try{const r=await callAI('ask_dish',{dish:slim(dish),question});return{answer:r.answer,src:'🤖 תשובת מר שף (AI)'}}catch(e){var why=aiErr(e)}}
 return{answer:localAnswer(dish,question)+'\n\n'+DISC,src:'תשובה בסיסית (הדגמה, ללא AI)'+(why?' – '+why:'')}}
const SUBS={'ביצים':'רסק תפוחים (¼ כוס לביצה) או זרעי פשתן טחונים עם מים','חמאה':'שמן זית או שמן קוקוס','פרמזן':'שמרי בירה או גבינה קשה אחרת','מוצרלה':'גבינה צהובה או טופו','שמנת':'חלב קוקוס','בשר טחון':'עדשים או טופו מפורר','חזה עוף':'טופו או פרגיות','כרעי עוף':'פרגיות או ירקות שורש לגרסה צמחונית','רוטב סויה':'טמארי (ללא גלוטן)','פסטה':'פסטה ללא גלוטן או קישואים ספירלה','טחינה':'חמאת בוטנים בהירה (בזהירות לאלרגיות)','לחמניות':'לחמניות ללא גלוטן או עלי חסה','אורז ארבוריו':'אורז עגול רגיל','בזיליקום':'פטרוזיליה','מיונז':'יוגורט'};
function localAnswer(d,q){const E=eff(d).ing,n=d.n,hit=E.find(x=>q.includes(x.n)||x.n.split(' ').some(w=>w.length>2&&q.includes(w)));
 if(/להחליף|תחליף|במקום|אין לי|אלרג|רגיש|טבעוני|צמחוני|גלוטן/.test(q)){const list=(hit?[hit]:E).map(x=>SUBS[x.n]?`${x.n} ← ${SUBS[x.n]}`:null).filter(Boolean);return list.length?'תחליפים אפשריים:\n'+list.join('\n'):(hit?`אין לי תחליף מוכן ל${hit.n}. אפשר לנסות מרכיב בעל מרקם/טעם דומה.`:'ציין איזה מרכיב תרצה להחליף.')}
 if(/זמן|כמה זמן|מתי|דקות|שעה/.test(q))return `זמן ההכנה המשוער של ${n}: כ-${d.min} דקות. בתוכנית מומלץ להתחיל כ-${d.min+15} דקות לפני הארוחה.`;
 if(/כמה|כמות|גרם|מנות/.test(q)){if(hit)return `${hit.n}: ${fmt(hit.q)} ${hit.u} למנה אחת.`;return 'כמויות למנה אחת:\n'+E.map(x=>`${x.n}: ${fmt(x.q)} ${x.u}`).join('\n')}
 {const W=q.split(/[\s,?.!]+/).filter(w=>w.length>2&&!/איך|מה|כמה|אפשר|צריך|המנה|את|של/.test(w));const L=W.length?d.steps.filter(s=>W.some(w=>s.includes(w))):[];if(L.length&&L.length<6&&!/איך מכינים|שלבי/.test(q))return 'מצאתי בהוראות:\n'+L.join('\n')}
 if(/איך|שלב|הכנה|מכינים|להכין/.test(q)&&!/מוכן|יודעים|סימן|לחתוך|חיתוך|מעלות|תנור|טיפ|טעות|מראש/.test(q))return d.steps.length?'שלבי ההכנה:\n'+d.steps.map((s,i)=>`${i+1}. ${s}`).join('\n'):'לא הוזנו שלבי הכנה למנה זו.';
 if(/מרכיב|מה צריך|מה יש|רכיב/.test(q)||hit)return hit?`כן, ${n} כולל ${hit.n} (${fmt(hit.q)} ${hit.u} למנה).`:'המרכיבים: '+E.map(x=>x.n).join(', ');
 if(/טיפ|טעות|טעויות|סוד|להצליח/.test(q)&&d.tips)return 'טיפים:\n'+d.tips.map(t=>'• '+t).join('\n');
 if(/מראש|מוקדם|יום לפני/.test(q))return d.ahead||'אין הנחיה ייעודית להכנה מראש; עדיף להכין סמוך להגשה.';
 if(/מעלות|טמפרטור|תנור|אש /.test(q)){const L=d.steps.filter(s=>/מעלות|אש |תנור/.test(s));if(L.length)return L.join('\n')}
 if(/מוכן|עשוי|יודעים|סימן/.test(q)){const L=d.steps.filter(s=>/מוכן|עד |סימני|במרכז/.test(s));if(L.length)return L.join('\n')}
 if(/לחתוך|חיתוך|חותכים|גודל|עובי|ס״מ/.test(q)){const L=d.steps.filter(s=>/חותכים|פורסים|קוצצים|ס״מ|מ״מ/.test(s));if(L.length)return L.join('\n')}
 if(/להקפיא|לשמור|מקרר|למחרת/.test(q))return d.ahead?d.ahead+'\n': 'באופן כללי: לקרר בכלי סגור ולצרוך תוך 2–3 ימים. הקפאה מתאימה לרוב לתבשילים, פחות לסלטים טריים.';
 if(/ילד/.test(q))return 'לילדים מומלץ להפחית חריפות ותיבול, ולהגיש בנפרד רכיבים שהם לא אוהבים. בתוכנית ילד נחשב לחצי מנה.';
 return `לא מצאתי תשובה מדויקת. על ${n} אני יודע: מרכיבים (${E.map(x=>x.n).join(', ')}), זמן הכנה ~${d.min} דק׳ ו-${d.steps.length} שלבי הכנה. נסה לשאול על כמויות, תחליפים, זמנים או שלבים.`}
if(SB){SB.auth.getSession().then(({data})=>setSession(data.session));SB.auth.onAuthStateChange((ev,sess)=>{if(ev!='INITIAL_SESSION')setSession(sess)})}else setSession(null);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
